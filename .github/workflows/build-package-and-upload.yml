name: Check and build addon

on:
  push:
    tags:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
        CF_API_KEY: ${{ secrets.CF_API_KEY }}
        #WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
        #WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
        GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run luacheck
        uses: BigWigsMods/actions/luacheck@master
        with:
          args: -qo 011

      - name: Package retail
        if: >-
          !contains(github.event.head_commit.message, '#skipretail') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2

      - name: Package classic
        if: >-
          !contains(github.event.head_commit.message, '#skipclassic') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2
        with:
          args: -g classic

      - name: Package mists
        if: >-
          !contains(github.event.head_commit.message, '#skipmop') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2
        with:
          args: -g mists

      - name: Package bcc
        if: >-
          !contains(github.event.head_commit.message, '#skipbcc') &&
          !contains(github.event.head_commit.message, '#skipall')
        uses: BigWigsMods/packager@v2
        with:
          args: -g bcc
